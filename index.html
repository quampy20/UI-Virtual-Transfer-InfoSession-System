<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Virtual Transfer Info Sessions — Planning Hub</title>
<style>
  :root{
    /* University of Idaho brand: Pride Gold #F1B300 · Black #191919 · White #FFFFFF (grays = neutral shades) */
    --bg:#F5F5F5; --surface:#FFFFFF; --surface-2:#FAFAFA;
    --ink:#191919; --ink-2:#4A4A4A; --muted:#767676;
    --gold:#F1B300; --gold-strong:#F1B300; --gold-tint:#FDF4D9; --gold-line:#FAE4A6;
    --border:#E3E3E3; --border-2:#EEEEEE;
    --header:#FFFFFF; --header-ink:#191919;
    --radius:12px; --radius-sm:8px;
    --shadow:0 1px 2px rgba(28,27,24,.05), 0 4px 16px rgba(28,27,24,.06);
    --font-body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --font-display:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}

  /* ---------- Header ---------- */
  .site-header{background:var(--header);color:var(--header-ink);padding:34px 24px 30px;border-bottom:4px solid var(--gold)}
  .header-inner{max-width:1060px;margin:0 auto;display:flex;align-items:center;gap:18px}
  .logo{height:64px;width:auto;flex:none}
  .site-header h1{font-family:var(--font-display);font-size:27px;font-weight:600;letter-spacing:.2px;line-height:1.2}
  .site-header .sub{color:#767676;font-size:13.5px;margin-top:3px;letter-spacing:.3px}

  /* ---------- Nav ---------- */
  .tabbar{position:sticky;top:0;z-index:40;background:rgba(245,245,245,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
  .tabbar-inner{max-width:1060px;margin:0 auto;display:flex;align-items:center;gap:4px;padding:10px 24px;flex-wrap:wrap}
  .tab{appearance:none;border:1px solid transparent;background:transparent;color:var(--ink-2);font:inherit;font-size:14px;font-weight:600;padding:7px 14px;border-radius:999px;cursor:pointer;transition:all .15s}
  .tab:hover{color:var(--ink);background:var(--gold-tint)}
  .tab.active{background:var(--ink);color:#F5F1E6;border-color:var(--ink)}
  .tab-spacer{flex:1}
  .tool-btn{appearance:none;border:1px solid var(--border);background:var(--surface);color:var(--ink-2);font:inherit;font-size:12.5px;font-weight:600;padding:6px 11px;border-radius:8px;cursor:pointer}
  .tool-btn:hover{border-color:var(--gold);color:var(--ink)}

  /* ---------- Layout ---------- */
  main{max-width:1060px;margin:0 auto;padding:28px 24px 80px}
  .view{display:none}
  .view.active{display:block;animation:fadein .18s ease}
  @keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .section-title{font-family:var(--font-display);font-size:21px;font-weight:600;margin:26px 0 6px}
  .section-title:first-child{margin-top:0}
  .section-note{color:var(--ink-2);font-size:13.5px;margin-bottom:16px;max-width:70ch}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 22px;margin-bottom:16px}
  .card-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:760px){.card-grid{grid-template-columns:1fr}}

  /* ---------- Badges & chips ---------- */
  .badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;padding:3px 9px;border-radius:999px}
  .badge.proposed{background:#EEEEEE;color:#4A4A4A}
  .badge.confirmed{background:var(--gold);color:#191919}
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border-2);color:var(--ink-2)}
  .chip .dot{width:7px;height:7px;border-radius:50%;background:var(--gold);flex:none}
  .due{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
  .due.ok{background:var(--surface-2);border:1px solid var(--border-2);color:var(--ink-2)}
  .due.soon{background:var(--gold-tint);border:1px solid var(--gold-line);color:#191919}
  .due.asap{background:#191919;color:var(--gold)}
  .due.done{background:#EEEEEE;color:#5C5C5C}

  /* ---------- Event cards (dashboard) ---------- */
  .event-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .event-date{font-family:var(--font-display);font-size:22px;font-weight:600;line-height:1.25}
  .event-meta{color:var(--ink-2);font-size:13.5px;margin-top:2px}
  .countdown{font-size:13px;font-weight:700;color:#191919;background:var(--gold-tint);border:1px solid var(--gold-line);padding:4px 11px;border-radius:999px;white-space:nowrap}
  .staff-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .progress-wrap{margin-top:16px}
  .progress-label{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-2);font-weight:600;margin-bottom:5px}
  .progress{height:8px;border-radius:999px;background:var(--border-2);overflow:hidden}
  .progress>span{display:block;height:100%;border-radius:999px;background:var(--gold);transition:width .3s}
  .alert-line{margin-top:12px;font-size:13px;font-weight:700;color:#191919;display:flex;align-items:center;gap:6px}

  /* ---------- Next actions ---------- */
  .action-row{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--border-2)}
  .action-row:last-child{border-bottom:none}
  .action-row .when{flex:none;width:168px;font-size:12.5px;font-weight:700;color:var(--ink-2)}
  .action-row .when .due{white-space:normal;line-height:1.35}
  .action-row .what{flex:1;font-size:14px}
  .action-row .ev{color:var(--muted);font-size:12.5px}

  /* ---------- Checklist ---------- */
  .ev-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
  .ev-toolbar label{font-size:12.5px;font-weight:700;color:var(--ink-2)}
  input[type="date"],input[type="text"],select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:7px 10px}
  input[type="date"]:focus,input[type="text"]:focus,select:focus,textarea:focus{outline:2px solid var(--gold-line);border-color:var(--gold)}
  .zoom-input{flex:1;min-width:200px;font-size:13px}
  .task{display:flex;align-items:flex-start;gap:12px;padding:12px 4px;border-bottom:1px solid var(--border-2)}
  .task:last-child{border-bottom:none}
  .task input[type="checkbox"]{width:19px;height:19px;margin-top:2px;accent-color:#191919;cursor:pointer;flex:none}
  .task .t-label{flex:1;font-size:14.5px}
  .task .t-label small{display:block;color:var(--muted);font-size:12.5px;margin-top:1px}
  .task.done .t-label{color:var(--muted);text-decoration:line-through}
  .task.done .t-label small{text-decoration:line-through}
  .link-danger{appearance:none;background:none;border:none;color:#767676;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;padding:4px}
  .link-danger:hover{text-decoration:underline}
  .btn{appearance:none;border:1px solid var(--ink);background:var(--ink);color:#F5F1E6;font:inherit;font-size:13.5px;font-weight:600;padding:8px 16px;border-radius:var(--radius-sm);cursor:pointer;transition:opacity .15s}
  .btn:hover{opacity:.85}
  .btn.secondary{background:var(--surface);color:var(--ink);border-color:var(--border)}
  .btn.secondary:hover{border-color:var(--gold);opacity:1}
  .btn.gold{background:var(--gold);border-color:var(--gold);color:#191919}
  .confirm-toggle{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer;user-select:none}
  .confirm-toggle input{width:16px;height:16px;accent-color:#191919}

  /* ---------- Staffing ---------- */
  .staff-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px}
  @media(max-width:700px){.staff-grid{grid-template-columns:1fr}}
  .staff-slot label{display:block;font-size:12px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;color:var(--ink-2);margin-bottom:5px}
  .staff-slot select{width:100%}
  /* ---------- Past sessions list ---------- */
  .past-row{display:flex;align-items:center;gap:14px;padding:12px 4px;border-bottom:1px solid var(--border-2)}
  .past-row:last-child{border-bottom:none}
  .past-when{flex:none;width:152px}
  .past-when strong{font-size:14px}
  .past-when small{display:block;color:var(--muted);font-size:12px}
  .past-info{flex:1;font-size:13.5px;color:var(--ink-2);line-height:1.45}
  .past-info strong{color:var(--ink)}
  .past-info a{color:var(--ink);font-weight:600}
  .past-notes{flex:none;width:250px;font-size:13px;padding:6px 9px}
  @media(max-width:760px){.past-row{flex-wrap:wrap}.past-notes{width:100%}}
  .staff-slot .role-note{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.4}
  .suggest-note{margin-top:12px;font-size:13px;color:var(--ink-2);background:var(--gold-tint);border:1px solid var(--gold-line);border-radius:var(--radius-sm);padding:10px 13px;display:none}
  .suggest-note.show{display:block}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{text-align:left;font-size:12px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--ink-2);padding:9px 10px;border-bottom:2px solid var(--border)}
  td{padding:9px 10px;border-bottom:1px solid var(--border-2)}
  tr:last-child td{border-bottom:none}
  td.num{font-variant-numeric:tabular-nums;font-weight:600}

  /* ---------- Templates ---------- */
  .tpl-layout{display:grid;grid-template-columns:280px 1fr;gap:16px}
  @media(max-width:820px){.tpl-layout{grid-template-columns:1fr}}
  .tpl-list{display:flex;flex-direction:column;gap:8px}
  .tpl-item{appearance:none;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;font:inherit;cursor:pointer;transition:all .15s}
  .tpl-item:hover{border-color:var(--gold)}
  .tpl-item.active{border-color:var(--gold-strong);background:var(--gold-tint)}
  .tpl-item .t-name{font-weight:700;font-size:14px}
  .tpl-item .t-to{font-size:12.5px;color:var(--muted);margin-top:1px}
  .tpl-pane .subject-line{font-weight:700;font-size:14.5px;margin-bottom:10px;padding:10px 13px;background:var(--surface-2);border:1px solid var(--border-2);border-radius:var(--radius-sm)}
  .tpl-pane textarea{width:100%;min-height:340px;font-size:14px;line-height:1.55;resize:vertical}
  .tpl-actions{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;align-items:center}
  .tpl-eventpick{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .tpl-eventpick label{font-size:12.5px;font-weight:700;color:var(--ink-2)}

  /* ---------- Guide ---------- */
  .step{display:flex;gap:15px;padding:13px 4px;border-bottom:1px solid var(--border-2)}
  .step:last-child{border-bottom:none}
  .step-num{flex:none;width:30px;height:30px;border-radius:50%;background:var(--gold-tint);border:1px solid var(--gold-line);color:#191919;font-weight:700;font-size:13.5px;display:flex;align-items:center;justify-content:center}
  .step-body{font-size:14.5px}
  .step-body small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
  .note-box{background:var(--gold-tint);border:1px solid var(--gold-line);border-radius:var(--radius-sm);padding:14px 16px;font-size:13.5px;color:var(--ink-2);margin-top:14px}
  .note-box strong{color:var(--ink)}

  /* ---------- Toast & footer ---------- */
  #toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(8px);background:var(--ink);color:#F5F1E6;font-size:13.5px;font-weight:600;padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:all .25s;z-index:99}
  #toast.show{opacity:1;transform:translateX(-50%)}
  footer{max-width:1060px;margin:0 auto;padding:0 24px 40px;color:var(--muted);font-size:12.5px}
  .empty{color:var(--muted);font-size:14px;padding:14px 4px}
</style>
</head>

<script>
'use strict';

/* ================= Storage (safe: falls back to in-memory) ================= */
const store = (() => {
  try { const t='__vtis_t'; window.localStorage.setItem(t,'1'); window.localStorage.removeItem(t); return window.localStorage; }
  catch(e){ const m={}; return { getItem:k=>(k in m?m[k]:null), setItem:(k,v)=>{m[k]=String(v);}, removeItem:k=>{delete m[k];} }; }
})();
const KEY = 'vtis-hub-v1';

/* ================= Seed data (from the semester sheet) ================= */
function seed(){
  return {
    events: [
      { id:'ev1', date:'2026-09-15', confirmed:false, zoom:'', presenter:'', moderator:'', registrar:'Rebecca', done:{} },
      { id:'ev2', date:'2026-11-03', confirmed:false, zoom:'', presenter:'', moderator:'', registrar:'Rebecca', done:{} }
    ],
    roster: [
      { name:'Becky',    presented:5, chat:3, stage:'presenter' },
      { name:'Mikayla',  presented:4, chat:1, stage:'presenter' },
      { name:'Jordan',   presented:3, chat:1, stage:'presenter' },
      { name:'Jermaine', presented:2, chat:1, stage:'presenter' },
      { name:'Cassi',    presented:2, chat:2, stage:'presenter' },
      { name:'Casey',    presented:2, chat:2, stage:'presenter' },
      { name:'Alexis',   presented:2, chat:1, stage:'presenter' },
      { name:'Nain',     presented:1, chat:4, stage:'presenter' },
      { name:'Camille',  presented:1, chat:2, stage:'presenter' },
      { name:'Timbrel',  presented:0, chat:0, stage:'shadowed' },
      { name:'Fatima',   presented:0, chat:0, stage:'shadowed' }
    ],
    registrars: ['Rebecca','Hallie']
  };
}
let state;
try { state = JSON.parse(store.getItem(KEY)) || seed(); } catch(e){ state = seed(); }
function save(){ state.events.sort((a,b)=>a.date<b.date?-1:1); store.setItem(KEY, JSON.stringify(state)); }

/* ================= Checklist template (offset = days before session) ================= */
const TASKS = [
  { id:'t1',  off:60, label:'Confirm the date & time with Rebecca (Registrar’s Office)', detail:'Rebecca is the Registrar staff member who works with transfer students; Hallie can fill in.' },
  { id:'t2',  off:58, label:'Create the Zoom meeting', detail:'Turn on the waiting room. You’ll add the counselors as alternative hosts once staffing is set.' },
  { id:'t3',  off:55, label:'Send the date, time & Zoom link to Lindsay', detail:'She creates the Slate event and posts it to the transfer info portal.' },
  { id:'t4',  off:45, label:'Confirm staffing for the session', detail:'Counselor 1 presents; Counselor 2 moderates chat; plus Registrar staff. Use the Staffing tab.' },
  { id:'t5',  off:42, label:'Record staffing & set alternative hosts in Zoom', detail:'Add staffing to the semester sheet and make both counselors alternative hosts.' },
  { id:'t6',  off:35, label:'Create the flyer & send it to all Admissions Counselors', detail:'One flyer listing every session date for the semester.' },
  { id:'t7',  off:33, label:'Ask Amber to schedule the Slate email to prospects', detail:'The periodic email promoting the sessions to prospective transfer students.' },
  { id:'t8',  off:14, label:'Review & update the presentation PPT', detail:'Make sure the content is accurate for the current semester.' },
  { id:'t9',  off:7,  label:'Post the staffing reminder in the Transfer Recruitment chat', detail:'Also double-check the waiting room is on and the hosts are accurate.' },
  { id:'t10', off:0,  label:'Run the session — 12:00–1:00 pm Pacific', detail:'' },
  { id:'t11', off:-1, label:'Counselor 2: submit participant names for Slate check-in', detail:'Launch check-in in Slate the day after the event.' }
];

/* ================= Session history (from the current-year staffing sheet) ================= */
const DONE_ALL = {t1:true,t2:true,t3:true,t4:true,t5:true,t6:true,t7:true,t8:true,t9:true,t10:true,t11:true};
const HISTORY = [
  { id:'h1', date:'2025-09-16', presenter:'Mikayla', moderator:'Nain',     registrar:'',        notes:'' },
  { id:'h2', date:'2025-11-04', presenter:'Seneca',  moderator:'Alexis',   registrar:'',        notes:'' },
  { id:'h3', date:'2026-01-20', presenter:'Alexis',  moderator:'Aspen',    registrar:'Rebecca', notes:'' },
  { id:'h4', date:'2026-03-18', presenter:'Mikayla', moderator:'Camille',  registrar:'Hallie',  notes:'' },
  { id:'h5', date:'2026-06-16', presenter:'Alexis',  moderator:'Jermaine', registrar:'Rebecca', notes:'' },
  { id:'h6', date:'2026-07-22', presenter:'Jordan',  moderator:'Becky',    registrar:'',        notes:'Sheet listed both July 21 and July 22 for this session.' }
];
if (!state.seedHistory) {
  HISTORY.forEach(h => {
    if (!state.events.some(e => e.date === h.date)) {
      state.events.push(Object.assign({ confirmed:true, zoom:'', inBaseline:true, done:Object.assign({}, DONE_ALL) }, h));
    }
  });
  state.seedHistory = true;
  save();
}
/* The sheet's frequency counts already include the archived 2025–26 sessions;
   flag those so they aren't counted twice. Sessions held from here on add to the tallies. */
if (!state.baselineFlagged) {
  state.events.forEach(e => { if (/^h\d+$/.test(e.id)) e.inBaseline = true; });
  state.baselineFlagged = true;
  save();
}

/* ================= Date helpers ================= */
function pd(isoStr){ const p = isoStr.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); }
function addDays(d,n){ const x = new Date(d); x.setDate(x.getDate()+n); return x; }
function fmtLong(d){ return d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'}); }
function fmtMed(d){ return d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'}); }
function fmtShort(d){ return d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}); }
function today0(){ const t = new Date(); t.setHours(0,0,0,0); return t; }
function daysUntil(d){ return Math.round((d - today0()) / 86400000); }
function deadline(ev, task){ return addDays(pd(ev.date), -task.off); }
function taskStatus(ev, task){
  if (ev.done[task.id]) return 'done';
  const n = daysUntil(deadline(ev, task));
  if (n < 0) return 'asap';
  if (n <= 7) return 'soon';
  return 'ok';
}
function dueChip(ev, task){
  const d = deadline(ev, task), s = taskStatus(ev, task);
  if (s==='done') return '<span class="due done">✓ Done</span>';
  if (s==='asap') return '<span class="due asap">⚠ ASAP · was '+fmtShort(d)+'</span>';
  if (s==='soon') return '<span class="due soon">⏰ '+fmtShort(d)+'</span>';
  return '<span class="due ok">'+fmtShort(d)+'</span>';
}
function semesterOf(isoStr){
  const d = pd(isoStr), m = d.getMonth()+1;
  const term = (m>=8) ? 'Fall' : (m>=6 ? 'Summer' : 'Spring');
  return term + ' ' + d.getFullYear();
}
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function upcoming(){ return state.events.filter(e => daysUntil(pd(e.date)) >= -1); }
function past(){ return state.events.filter(e => daysUntil(pd(e.date)) < -1); }

/* ================= Live team tallies ================= */
/* Baseline counts come from the staffing sheet; every session held through this
   system (anything in the archive that isn't part of that baseline) adds to them. */
function liveCounts(p){
  let presented = p.presented, chat = p.chat;
  past().forEach(e => {
    if (!e.inBaseline){
      if (e.presenter === p.name) presented++;
      if (e.moderator === p.name) chat++;
    }
  });
  return { presented, chat };
}
function tallyMap(){ const C = {}; state.roster.forEach(p => { C[p.name] = liveCounts(p); }); return C; }

/* ================= Staffing suggestions ================= */
function suggestFor(ev){
  const others = state.events.filter(e => e.id!==ev.id && daysUntil(pd(e.date)) >= 0);
  const busy = n => others.some(e => e.presenter===n || e.moderator===n) ? 1 : 0;
  const C = tallyMap();
  const stageOf = p => (p.stage==='shadowed' && C[p.name].chat===0) ? 'shadowed' : 'active';

  const presPool = state.roster.filter(p => stageOf(p)!=='shadowed')
    .slice().sort((a,b) => (C[a.name].presented-C[b.name].presented) || (busy(a.name)-busy(b.name)) || ((C[a.name].presented+C[a.name].chat)-(C[b.name].presented+C[b.name].chat)) || (a.name<b.name?-1:1));
  const presenter = presPool[0];

  const shadowPool = state.roster.filter(p => stageOf(p)==='shadowed' && p.name!==presenter.name)
    .slice().sort((a,b) => (busy(a.name)-busy(b.name)) || (C[a.name].chat-C[b.name].chat) || (a.name<b.name?-1:1));
  const chatPool = state.roster.filter(p => stageOf(p)!=='shadowed' && p.name!==presenter.name)
    .slice().sort((a,b) => (C[a.name].chat-C[b.name].chat) || (busy(a.name)-busy(b.name)) || (a.name<b.name?-1:1));
  const moderator = shadowPool[0] || chatPool[0];

  const pc = C[presenter.name].presented;
  let reason = '<strong>' + esc(presenter.name) + '</strong> has presented ' + pc +
    ' time' + (pc===1?'':'s') + ' — among the fewest on the team — so they’re up next to present. ';
  if (moderator && stageOf(moderator)==='shadowed') {
    reason += '<strong>' + esc(moderator.name) + '</strong> has shadowed and is ready to step into the chat moderator role.';
  } else if (moderator) {
    const mc = C[moderator.name].chat;
    reason += '<strong>' + esc(moderator.name) + '</strong> has moderated chat ' + mc + ' time' + (mc===1?'':'s') + ' — fewest available — so they take chat.';
  }
  return { presenter: presenter.name, moderator: moderator ? moderator.name : '', reason: reason + ' You can change either pick below.' };
}

/* ================= Email templates ================= */
function evLine(ev){ return fmtLong(pd(ev.date)) + ', 12:00–1:00 pm Pacific'; }
function evLineZoom(ev){ return '  • ' + evLine(ev) + '\n    Zoom: ' + (ev.zoom || '[add Zoom link]'); }
function bulletDates(evs){ return evs.map(e => '  • ' + evLine(e)).join('\n'); }
const PORTAL = 'https://futurevandals.uidaho.edu/portal/transfer-info';

const TEMPLATES = [
  { id:'rebecca', name:'Date availability check', to:'Rebecca · Registrar’s Office', multi:true,
    subject: evs => 'Virtual Transfer Info Sessions — checking dates for ' + [...new Set(evs.map(e=>semesterOf(e.date)))].join(' & '),
    body: evs =>
'Hi Rebecca,\n\nI hope your week is going well! I’m coordinating our Virtual Transfer Information Sessions and wanted to check dates with you before we lock anything in, since we’d love to have you join us.\n\nWe’re hoping to hold sessions on:\n\n' + bulletDates(evs) + '\n\nWould these work with your schedule? If a date doesn’t work, just let me know which days would — we’re happy to adjust. And if you’re unavailable for one, would Hallie or someone else from the Registrar’s Office be able to join?\n\nThank you!\nJermaine' },

  { id:'lindsay', name:'Slate events + Zoom links', to:'Lindsay', multi:true,

  { id:'amber', name:'Prospect email request', to:'Amber', multi:true,
    subject: evs => 'Slate email to prospective transfer students — upcoming info sessions',
    body: evs =>
'Hi Amber,\n\nCould you schedule the periodic Slate email to prospective transfer students promoting our upcoming Virtual Transfer Info Sessions? Here are the details:\n\n' + bulletDates(evs) + '\n\nStudents can find the sessions and register here: ' + PORTAL + '\n\nThank you!\nJermaine' },

  { id:'staffing', name:'Counselor staffing request', to:'All Admissions Counselors', multi:true,
    subject: evs => 'Staffing for ' + [...new Set(evs.map(e=>semesterOf(e.date)))].join(' & ') + ' Virtual Transfer Info Sessions',
    body: evs =>
'Hi everyone,\n\nOur Virtual Transfer Info Sessions are scheduled for the dates below, and I’m putting staffing together. Each session needs a Counselor 1 (presenter) and a Counselor 2 (chat moderator, who also records participant names for Slate check-in):\n\n' + bulletDates(evs) + '\n\nPlease reply with the dates you’re available and whether you’d prefer to present or moderate. Once assignments are confirmed I’ll add both counselors as alternative hosts in Zoom.\n\nThanks!\nJermaine' },

  { id:'reminder', name:'Week-before reminder', to:'Transfer Recruitment chat · Teams', multi:false,
    subject: evs => '(Teams message — no subject needed)',
    body: evs => { const ev = evs[0];
      return 'Reminder — our Virtual Transfer Info Session is ' + fmtLong(pd(ev.date)) + ' at 12:00 pm Pacific.\n\nPresenter (Counselor 1): ' + (ev.presenter||'[presenter]') + '\nChat moderator (Counselor 2): ' + (ev.moderator||'[moderator]') + '\nRegistrar’s Office: ' + (ev.registrar||'[registrar staff]') + '\n\nI’ve double-checked that the waiting room is on and the alternative hosts are set. ' + (ev.moderator||'[moderator]') + ', a reminder to capture participant names for Slate check-in after the session.\n\nZoom link: ' + (ev.zoom||'[add Zoom link]'); } },

  { id:'shadow', name:'New counselor shadow invite', to:'New Admissions Counselor', multi:false,
    subject: evs => 'Come shadow a Virtual Transfer Info Session',
    body: evs => { const ev = evs[0];
      return 'Hi [name],\n\nWelcome to the team! I’d love to have you shadow our next Virtual Transfer Info Session on ' + fmtLong(pd(ev.date)) + ' at 12:00 pm Pacific so you can see how it runs. After shadowing, you’ll step into the chat moderator role, and then presenter once you’re ready.\n\nI’ll also add you to the Transfer Recruitment chat in Teams — that’s where session reminders and staffing notes go.\n\nZoom link: ' + (ev.zoom||'[add Zoom link]') + '\n\nGlad to have you aboard!\nJermaine'; } }
];
let tplState = { id:'rebecca', evSel:'all' };

/* ================= Views ================= */
const $ = sel => document.querySelector(sel);

function staffChip(label, name){
  return '<span class="chip"><span class="dot"></span>' + label + ': ' + (name ? '<strong>'+esc(name)+'</strong>' : '<em style="color:var(--muted)">not set</em>') + '</span>';
}

function renderDashboard(){
  const evs = upcoming();
  let html = '<h2 class="section-title">Upcoming sessions</h2>' +
    '<p class="section-note">Sessions run twice a semester and twice in summer, 12:00–1:00 pm Pacific. Deadlines below are calculated from each session’s date — change a date on the Checklists tab and everything recalculates.</p>';

  if (!evs.length) html += '<div class="card empty">No upcoming sessions — add one on the Checklists tab.</div>';

  html += '<div class="card-grid">';
  evs.forEach(ev => {
    const d = pd(ev.date), n = daysUntil(d);
    const doneCount = TASKS.filter(t=>ev.done[t.id]).length;
    const overdue = TASKS.filter(t=>taskStatus(ev,t)==='asap').length;
    html += '<div class="card">' +
      '<div class="event-head"><div>' +
        '<div class="event-date">' + fmtLong(d) + '</div>' +
        '<div class="event-meta">12:00–1:00 pm Pacific · Zoom · ' + semesterOf(ev.date) + '</div>' +
      '</div><div style="display:flex;flex-direction:column;align-items:flex-end;gap:7px">' +
        '<span class="countdown">' + (n===0 ? 'Today!' : n===1 ? 'Tomorrow' : 'in ' + n + ' days') + '</span>' +
        (ev.confirmed ? '<span class="badge confirmed">✓ Confirmed</span>' : '<span class="badge proposed">○ Proposed — confirm with Rebecca</span>') +
      '</div></div>' +
      '<div class="staff-row">' + staffChip('Presenter', ev.presenter) + staffChip('Chat', ev.moderator) + staffChip('Registrar', ev.registrar) + '</div>' +
      '<div class="progress-wrap"><div class="progress-label"><span>Checklist progress</span><span>' + doneCount + ' / ' + TASKS.length + '</span></div>' +
      '<div class="progress"><span style="width:' + Math.round(doneCount/TASKS.length*100) + '%"></span></div></div>' +
      (overdue ? '<div class="alert-line">⚠ ' + overdue + ' item' + (overdue===1?'':'s') + ' overdue — see Checklists tab</div>' : '') +
      '</div>';
  });
  html += '</div>';

  /* Next actions */
  const actions = [];
  evs.forEach(ev => TASKS.forEach(t => { if (!ev.done[t.id]) actions.push({ev, t, d: deadline(ev,t)}); }));
  actions.sort((a,b)=>a.d-b.d);
  html += '<h2 class="section-title">Next actions</h2><div class="card">';
  if (!actions.length) html += '<div class="empty">All caught up — nothing outstanding. ✨</div>';
  actions.slice(0,7).forEach(a => {
    html += '<div class="action-row"><span class="when">' + dueChip(a.ev, a.t) + '</span>' +
      '<span class="what">' + a.t.label + '</span>' +
      '<span class="ev">' + fmtShort(pd(a.ev.date)) + ' session</span></div>';
  });
  html += '</div>';

  if (past().length){
    html += '<h2 class="section-title">Past sessions</h2><div class="card">' +
      '<div class="empty">' + past().length + ' archived session' + (past().length===1?'':'s') + ' — full details, staffing and notes are on the <strong>Past Sessions</strong> tab.</div></div>';
  }
  $('#view-dashboard').innerHTML = html;
}

function renderChecklists(){
  const evs = upcoming();
  let html = '<h2 class="section-title">Session checklists</h2>' +
    '<p class="section-note">Each deadline is calculated from the session date. Change the date and every deadline updates automatically. Items past their date show an <span class="due asap" style="vertical-align:1px">⚠ ASAP</span> flag — with the September session on short notice, expect a few of those; just work top to bottom.</p>' +
    '<button class="btn secondary btn-add-event" style="margin-bottom:16px">+ Add a session</button>';

  evs.forEach(ev => {
    const d = pd(ev.date);
    const doneCount = TASKS.filter(t=>ev.done[t.id]).length;
    html += '<div class="card" data-ev="' + ev.id + '">' +
      '<div class="event-head"><div><div class="event-date">' + fmtLong(d) + '</div>' +
      '<div class="event-meta">' + semesterOf(ev.date) + ' · ' + doneCount + ' of ' + TASKS.length + ' done</div></div>' +
      (ev.confirmed ? '<span class="badge confirmed">✓ Confirmed</span>' : '<span class="badge proposed">○ Proposed</span>') + '</div>' +
      '<div class="ev-toolbar">' +
        '<label>Date</label><input type="date" class="ev-date" value="' + ev.date + '">' +
        '<label class="confirm-toggle"><input type="checkbox" class="ev-confirmed"' + (ev.confirmed?' checked':'') + '> Confirmed with Rebecca</label>' +
        '<input type="text" class="zoom-input ev-zoom" placeholder="Paste the Zoom link here…" value="' + esc(ev.zoom) + '">' +
        '<button class="link-danger ev-delete">Remove</button>' +
      '</div><div style="margin-top:10px">';
    TASKS.forEach(t => {
      html += '<div class="task' + (ev.done[t.id]?' done':'') + '"><input type="checkbox" data-task="' + t.id + '"' + (ev.done[t.id]?' checked':'') + '>' +
        '<div class="t-label">' + t.label + (t.detail ? '<small>' + t.detail + '</small>' : '') + '</div>' + dueChip(ev, t) + '</div>';
    });
    html += '</div></div>';
  });

  html += '<button class="btn secondary btn-add-event">+ Add a session</button>';
  $('#view-checklists').innerHTML = html;

  document.querySelectorAll('#view-checklists .card[data-ev]').forEach(card => {
    const ev = state.events.find(e => e.id === card.dataset.ev);
    card.querySelector('.ev-date').addEventListener('change', e => { if (e.target.value){ ev.date = e.target.value; save(); render(); } });
    card.querySelector('.ev-confirmed').addEventListener('change', e => { ev.confirmed = e.target.checked; save(); render(); });
    card.querySelector('.ev-zoom').addEventListener('change', e => { ev.zoom = e.target.value.trim(); save(); });
    card.querySelector('.ev-delete').addEventListener('click', () => {
      if (confirm('Remove the ' + fmtMed(pd(ev.date)) + ' session and its checklist?')){
        state.events = state.events.filter(e => e.id !== ev.id); save(); render();
      }
    });
    card.querySelectorAll('input[data-task]').forEach(cb => cb.addEventListener('change', e => {
      ev.done[e.target.dataset.task] = e.target.checked; save(); render();
    }));
  });
  document.querySelectorAll('#view-checklists .btn-add-event').forEach(b => b.addEventListener('click', () => {
    const last = state.events[state.events.length-1];
    const base = last ? addDays(pd(last.date), 49) : addDays(today0(), 60);
    const y = base.getFullYear(), m = String(base.getMonth()+1).padStart(2,'0'), dd = String(base.getDate()).padStart(2,'0');
    state.events.push({ id:'ev'+Date.now(), date:y+'-'+m+'-'+dd, confirmed:false, zoom:'', presenter:'', moderator:'', registrar:'Rebecca', done:{} });
    save(); render(); toast('Session added — set its date');
  }));
}

function renderStaffing(){
  const evs = upcoming();
  let html = '<h2 class="section-title">Session staffing</h2>' +
    '<p class="section-note">Counselor 1 presents. Counselor 2 backs them up, moderates the chat, records participant names for Slate check-in, and handles Zoom security. <strong>Suggest</strong> picks a fair rotation from the history below — every pick stays fully editable.</p>';

  evs.forEach(ev => {
    const opts = sel => '<option value="">— not set —</option>' + state.roster.map(p =>
      '<option value="' + esc(p.name) + '"' + (sel===p.name?' selected':'') + '>' + esc(p.name) + (p.stage==='shadowed'?' (shadowed — ready for chat)':'') + '</option>').join('');
    const regOpts = state.registrars.map(r => '<option' + (ev.registrar===r?' selected':'') + '>' + esc(r) + '</option>').join('');
    html += '<div class="card" data-ev="' + ev.id + '">' +
      '<div class="event-head"><div><div class="event-date">' + fmtLong(pd(ev.date)) + '</div>' +
      '<div class="event-meta">12:00–1:00 pm Pacific</div></div>' +
      '<button class="btn gold btn-suggest">✦ Suggest staffing</button></div>' +
      '<div class="suggest-note"></div>' +
      '<div class="staff-grid">' +
      '<div class="staff-slot"><label>Counselor 1 · Presenter</label><select class="sel-presenter">' + opts(ev.presenter) + '</select><div class="role-note">Leads the presentation.</div></div>' +
      '<div class="staff-slot"><label>Counselor 2 · Chat</label><select class="sel-moderator">' + opts(ev.moderator) + '</select><div class="role-note">Back-up, chat, participant check-in, Zoom security.</div></div>' +
      '<div class="staff-slot"><label>Registrar’s Office</label><select class="sel-registrar">' + regOpts + '</select><div class="role-note">Rebecca first; Hallie as alternate.</div></div>' +
      '</div></div>';
  });

  html += '<h2 class="section-title">Team history</h2>' +
    '<p class="section-note">Counts start from the current-year staffing sheet and update automatically as sessions are held — the day after a session runs, its presenter and chat moderator each get credit. New counselors progress: shadow a session → chat moderator → presenter.</p>' +
    '<div class="card"><table><thead><tr><th>Name</th><th style="text-align:right">Presented</th><th style="text-align:right">Chat</th><th>Stage</th></tr></thead><tbody>';
  const TC = tallyMap();
  state.roster.slice().sort((a,b)=>(TC[b.name].presented-TC[a.name].presented)||(TC[b.name].chat-TC[a.name].chat)).forEach(p => {
    const c = TC[p.name];
    const stillShadow = p.stage==='shadowed' && c.chat===0;
    html += '<tr><td><strong>' + esc(p.name) + '</strong></td><td class="num" style="text-align:right">' + c.presented + '</td>' +
      '<td class="num" style="text-align:right">' + c.chat + '</td>' +
      '<td>' + (stillShadow ? '<span class="badge proposed" style="text-transform:none;letter-spacing:0">Shadowed — next: chat</span>' : '<span class="chip">Active</span>') + '</td></tr>';
  });
  html += '</tbody></table>' +
    '<div class="ev-toolbar" style="margin-top:16px"><label>Add person</label>' +
    '<input type="text" id="new-person" placeholder="First name only" style="width:170px">' +
    '<select id="new-stage"><option value="shadowed">New — will shadow first</option><option value="presenter">Experienced counselor</option></select>' +
    '<button class="btn secondary" id="btn-add-person">Add</button></div></div>' +
    '<div class="note-box"><strong>Onboarding a new counselor:</strong> invite them to shadow a presentation first, then they become the chat moderator, then the presenter. Remember to add them to the Transfer Recruitment chat in Teams — the shadow-invite email template covers both.</div>';

  $('#view-staffing').innerHTML = html;

  document.querySelectorAll('#view-staffing .card[data-ev]').forEach(card => {
    const ev = state.events.find(e => e.id === card.dataset.ev);
    card.querySelector('.btn-suggest').addEventListener('click', () => {
      const s = suggestFor(ev);
      ev.presenter = s.presenter; ev.moderator = s.moderator; save();
      card.querySelector('.sel-presenter').value = s.presenter;
      card.querySelector('.sel-moderator').value = s.moderator;
      const note = card.querySelector('.suggest-note');
      note.innerHTML = s.reason; note.classList.add('show');
    });
    card.querySelector('.sel-presenter').addEventListener('change', e => { ev.presenter = e.target.value; save(); });
    card.querySelector('.sel-moderator').addEventListener('change', e => { ev.moderator = e.target.value; save(); });
    card.querySelector('.sel-registrar').addEventListener('change', e => { ev.registrar = e.target.value; save(); });
  });
  $('#btn-add-person').addEventListener('click', () => {
    const inp = $('#new-person'), name = inp.value.trim();
    if (!name) { toast('Type a first name first'); return; }
    if (state.roster.some(p => p.name.toLowerCase() === name.toLowerCase())) { toast(name + ' is already on the roster'); return; }
    state.roster.push({ name, presented:0, chat:0, stage: $('#new-stage').value });
    save(); render(); toast(name + ' added to the roster');
  });
}

function renderTemplates(){
  const evs = upcoming();
  const tpl = TEMPLATES.find(t => t.id === tplState.id) || TEMPLATES[0];
  const chosen = (tplState.evSel === 'all' || !evs.length)
    ? (evs.length ? evs : state.events)
    : [state.events.find(e => e.id === tplState.evSel) || evs[0]];
  const useEvs = tpl.multi ? chosen : [chosen[0]];

  let html = '<h2 class="section-title">Email templates</h2>' +
    '<p class="section-note">Dates, Zoom links and staffing fill in automatically from your sessions. Edit the text however you like, then copy it into Outlook or Teams. First names only, as requested.</p>' +
    '<div class="tpl-layout"><div class="tpl-list">';
  TEMPLATES.forEach(t => {
    html += '<button class="tpl-item' + (t.id===tpl.id?' active':'') + '" data-tpl="' + t.id + '">' +
      '<div class="t-name">' + t.name + '</div><div class="t-to">To: ' + t.to + '</div></button>';
  });
  html += '</div><div class="tpl-pane card" style="margin-bottom:0">';

  html += '<div class="tpl-eventpick"><label>For</label><select id="tpl-ev">';
  if (tpl.multi) html += '<option value="all"' + (tplState.evSel==='all'?' selected':'') + '>All upcoming sessions</option>';
  upcoming().forEach(e => { html += '<option value="' + e.id + '"' + (tplState.evSel===e.id?' selected':'') + '>' + fmtMed(pd(e.date)) + '</option>'; });
  html += '</select></div>';

  const subj = tpl.subject(useEvs);
  html += '<div class="subject-line">Subject: ' + esc(subj) + '</div>' +
    '<textarea id="tpl-body" spellcheck="false">' + esc(tpl.body(useEvs)) + '</textarea>' +
    '<div class="tpl-actions">' +
    '<button class="btn" id="btn-copy-body">Copy message</button>' +
    '<button class="btn secondary" id="btn-copy-subj">Copy subject</button>' +
    '<a class="btn secondary" id="btn-mailto" style="text-decoration:none">Open in email</a>' +
    '</div></div></div>';

  $('#view-templates').innerHTML = html;

  document.querySelectorAll('.tpl-item').forEach(b => b.addEventListener('click', () => {
    tplState.id = b.dataset.tpl;
    const t = TEMPLATES.find(x => x.id === tplState.id);
    if (!t.multi && tplState.evSel === 'all') tplState.evSel = (upcoming()[0]||state.events[0]||{}).id || 'all';
    if (t.multi) tplState.evSel = 'all';
    renderTemplates();
  }));
  $('#tpl-ev').addEventListener('change', e => { tplState.evSel = e.target.value; renderTemplates(); });
  $('#btn-copy-body').addEventListener('click', () => copyText($('#tpl-body').value, 'Message copied — paste into Outlook or Teams'));
  $('#btn-copy-subj').addEventListener('click', () => copyText(subj, 'Subject copied'));
  $('#btn-mailto').href = 'mailto:?subject=' + encodeURIComponent(subj) + '&body=' + encodeURIComponent($('#tpl-body') ? $('#tpl-body').value : tpl.body(useEvs));
}

    html += '<div class="card empty">No past sessions yet — they’ll appear here automatically after they run.</div>';

/* ================= Shared ================= */
function copyText(text, msg){
  const done = () => toast(msg);
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  } else fallbackCopy(text, done);
}
function fallbackCopy(text, done){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch(e){ toast('Copy failed — select the text manually'); }
  document.body.removeChild(ta);
}
let toastTimer;
function toast(msg){
  const el = $('#toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

function render(){
  renderDashboard(); renderChecklists(); renderStaffing(); renderTemplates(); renderPast(); renderGuide();
}

/* Tabs */
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x===t));
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + t.dataset.view));
}));

/* Export / import */
$('#btn-export').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'transfer-sessions-plan.json';
  a.click(); URL.revokeObjectURL(a.href);
  toast('Backup downloaded');
});
$('#btn-import').addEventListener('click', () => $('#import-file').click());
$('#import-file').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const data = JSON.parse(r.result);
      if (!data.events || !data.roster) throw new Error('bad');
      state = data; save(); render(); toast('Plan restored from backup');
    } catch(err){ toast('That file doesn’t look like a plan backup'); }
  };
  r.readAsText(f); e.target.value = '';
});

save();
render();
</script>
